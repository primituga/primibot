services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=1m
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - ai-net

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set a strong secret}
      - SEARXNG_OUTGOING_FORMATS=json,plaintext
    volumes:
      - ./data/searxng:/etc/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - ai-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
      - searxng
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=True
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=searxng
      - RAG_WEB_SEARCH_RESULT_COUNT=8
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
    volumes:
      - ./data/open-webui:/app/backend/data
    networks:
      - ai-net

  flowise:
    image: flowiseai/flowise:latest
    container_name: flowise
    restart: unless-stopped
    depends_on:
      - ollama
      - searxng
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - FLOWISE_USERNAME=${FLOWISE_USERNAME:-admin}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD:?set a strong password}
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data/flowise:/root/.flowise
    networks:
      - ai-net

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - ai-net

  agent:
    image: python:3.11-slim
    container_name: langchain-agent
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
    command: bash -c "pip install --no-cache-dir -r requirements.txt && python agent.py"
    env_file:
      - .env
    depends_on:
      - ollama
      - searxng
      - flowise
      - redis
    networks:
      - ai-net
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/agent_heartbeat -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  ai-net:
    driver: bridge
